name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run repository quality gate
        run: ./scripts/quality_check.sh
